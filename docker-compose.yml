version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vidyamitra-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=vidyamitra

  postgres:
    image: postgres:16-alpine
    container_name: vidyamitra-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vidyamitra
      - POSTGRES_USER=vidyamitra
      - POSTGRES_PASSWORD=vidyamitra123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vidyamitra-redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: vidyamitra-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vidyamitra-ai
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - chromadb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidyamitra-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/vidyamitra
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/vidyamitra
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongodb
      - postgres
      - redis
      - ai-service

volumes:
  mongo_data:
  postgres_data:
  chroma_data:
