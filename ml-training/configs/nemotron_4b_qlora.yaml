# QLoRA Fine-Tuning Configuration for NVIDIA Nemotron-Mini-4B-Instruct
# Optimized for Socratic reasoning & pedagogical alignment for young learners
base_model: "nvidia/Nemotron-Mini-4B-Instruct"
output_dir: "./output/nemotron4b-vidyamitra"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training_arguments:
  learning_rate: 1.5e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_steps: 50
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_8bit"
  logging_steps: 10
  save_total_limit: 2
  fp16: true
  max_seq_length: 2048
