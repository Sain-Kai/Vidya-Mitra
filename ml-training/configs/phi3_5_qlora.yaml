# QLoRA Fine-Tuning Configuration for Microsoft Phi-3.5-mini-instruct (3.8B)
# Optimized for Kaggle Free Tier (NVIDIA T4 16GB / P100 16GB)
base_model: "microsoft/Phi-3.5-mini-instruct"
output_dir: "./output/phi3_5-vidyamitra-socratic"

quantization:
  load_in_4bit: true
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv_proj"
    - "o_proj"
    - "gate_up_proj"
    - "down_proj"

training_arguments:
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_8bit"
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "no"
  fp16: true
  bf16: false
  max_seq_length: 2048

dataset:
  train_file: "./dataset_generator/ncert_socratic_train.jsonl"
  val_file: "./dataset_generator/ncert_socratic_val.jsonl"
